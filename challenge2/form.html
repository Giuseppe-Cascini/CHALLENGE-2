<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form music streaming</title>
</head>
<body>
    <h1>Registrazione app di music streaming</h1>
    <form onsubmit="alert('Registrazione inviata')">
        <div>
            <input type="text"placeholder="inserisci il nome">
        </div>
        <div>
            <input type="text"placeholder="inserisci il cognome">
        </div>
        <div>
            <input type="email"placeholder="inserisci l'email">
        </div>
        <div>
            <input type="password"placeholder="inserisci la password">
        </div>
        <div>
            <p>inserisci la data di nascita:</p>
            <input type="date"placeholder="inserisci la data di nascita">
        </div>
        <div>
            <input type="number"placeholder="inserisci il numero di telefono">
        </div>
        <p>Quali sono i tuoi gusti musicali?</p>
        <div>
            <input type="checkbox"> Rock
        </div>
         <div>
            <input type="checkbox"> Rap
        </div>
         <div>
            <input type="checkbox"> Jazz
        </div>
         <div>
            <input type="checkbox"> Trap
        </div>
         <div>
            <input type="checkbox"> Hard Rock
        </div>
         <div>
            <input type="checkbox"> Pop
        </div>
         <div>
            <input type="checkbox"> Metal
        </div>
         <div>
            <input type="radio"> accettazione dei termini e condizioni d'uso
        </div>
        <button type="submit">INVIA REGISTRAZIONE</button>

    </form>
</body>
</html>
